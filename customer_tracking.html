<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetra - Status Pemasangan Sambungan Baru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; padding: 20px 0; }
        .tracking-card { background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 2rem; max-width: 650px; margin: 0 auto; }
        .brand-header { text-align: center; margin-bottom: 2rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 1.5rem; }
        .brand-header img { max-height: 65px; width: auto; }
        .timeline { position: relative; padding-left: 30px; margin-top: 1.5rem; }
        .timeline::before { content: ''; position: absolute; left: 11px; top: 5px; bottom: 5px; width: 2px; background: #e2e8f0; }
        .timeline-item { position: relative; margin-bottom: 1.5rem; }
        .timeline-item::before { content: ''; position: absolute; left: -25px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #cbd5e1; border: 2px solid #fff; box-shadow: 0 0 0 2px #cbd5e1; }
        .timeline-item.completed::before { background: #16a34a; box-shadow: 0 0 0 2px #16a34a; }
        .timeline-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .timeline-date { font-size: 0.8rem; color: #64748b; }
        .badge-status { font-size: 0.8rem; padding: 0.4em 0.8em; border-radius: 8px; font-weight: 600; }
        .bg-sukses { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .bg-tertunda { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .bg-gagal { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="container">
    <div class="tracking-card">
        <div class="brand-header">
            <img src="logo.jpg" alt="Aetra Logo">
            <h5 class="fw-bold mt-3 mb-1" style="color: #0f172a;">Pelacakan Status Pemasangan</h5>
            <p class="text-muted small mb-0">PT Aetra Air Tangerang</p>
        </div>

        <div id="loading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="small text-muted mt-2">Memuat data pelacakan...</p>
        </div>

        <div id="content" class="d-none">
            <div class="bg-light p-3 rounded-3 mb-4 border">
                <div class="row g-2">
                    <div class="col-6"><span class="small text-muted d-block">No. Form:</span><strong id="custNoForm" class="text-primary">-</strong></div>
                    <div class="col-6"><span class="small text-muted d-block">Nama Pelanggan:</span><strong id="custNama">-</strong></div>
                    <div class="col-12 mt-2"><span class="small text-muted d-block">Status Saat Ini:</span><span id="custStatusBadge" class="badge bg-primary mt-1">-</span></div>
                </div>
            </div>

            <h6 class="fw-bold mb-3" style="color:#0f172a;">Riwayat Progres</h6>
            <div class="timeline" id="timelineList"></div>

            <div id="detailPemasanganBox" class="mt-4 p-3 rounded-3 border d-none">
                <h6 class="fw-bold mb-2 fs-6">Detail Laporan Lapangan</h6>
                <div id="detailPemasanganContent"></div>
            </div>

            <div class="mt-4 pt-3 border-top text-center text-muted small">
                <p class="mb-1"><strong>Butuh Bantuan?</strong></p>
                <p class="mb-0">Contact Center 24 Jam: 021 5985474 | WA: 087788224645</p>
            </div>
        </div>

        <div id="errorBox" class="alert alert-danger d-none text-center">
            Data tidak ditemukan. Silakan periksa kembali tautan Anda.
        </div>
    </div>
</div>

<script>
    // ===================================================================
    const SUPABASE_URL = 'https://vyngziqwsdhetapjzlgr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5bmd6aXF3c2RoZXRhcGp6bGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODE0ODIsImV4cCI6MjEwMjQ1NzQ4Mn0._uJcP6YPkXH6mQmIHW-vrKOZIguHGKI_72zEWYei24s';
    // ===================================================================

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const formId = urlParams.get('id');

    async function loadTrackingData() {
        if (!formId) {
            document.getElementById('loading').classList.add('d-none');
            document.getElementById('errorBox').classList.remove('d-none');
            return;
        }

        const { data, error } = await _supabase.from('pelanggan').select('*').eq('id', formId).single();
        document.getElementById('loading').classList.add('d-none');

        if (error || !data) {
            document.getElementById('errorBox').classList.remove('d-none');
            return;
        }

        document.getElementById('content').classList.remove('d-none');
        document.getElementById('custNoForm').innerText = data.id;
        document.getElementById('custNama').innerText = data.nama;
        document.getElementById('custStatusBadge').innerText = data.status;

        const riwayat = data.riwayat_tgl || {};
        const steps = [
            { id: "1", title: "Pendaftaran Diterima" },
            { id: "2", title: "Pembayaran Diterima" },
            { id: "3", title: "Proses Pemasangan" },
            { id: "4", title: "Selesai" }
        ];

        let timelineHtml = "";
        steps.forEach(step => {
            const tgl = riwayat[step.id];
            const isDone = !!tgl;
            timelineHtml += `
                <div class="timeline-item ${isDone ? 'completed' : ''}">
                    <div class="timeline-title">${step.title}</div>
                    <div class="timeline-date">${isDone ? tgl : 'Belum diproses'}</div>
                </div>
            `;
        });
        document.getElementById('timelineList').innerHTML = timelineHtml;

        // Detail Laporan Lapangan
        if (riwayat.detail_pemasangan) {
            const det = riwayat.detail_pemasangan;
            const detBox = document.getElementById('detailPemasanganBox');
            const detContent = document.getElementById('detailPemasanganContent');
            detBox.classList.remove('d-none');

            let kondisiBadge = "";
            if (det.kondisi === "Sukses") kondisiBadge = `<span class="badge-status bg-sukses">✅ Sukses</span>`;
            else if (det.kondisi === "Tertunda") kondisiBadge = `<span class="badge-status bg-tertunda">⏳ Tertunda</span>`;
            else if (det.kondisi === "Gagal") kondisiBadge = `<span class="badge-status bg-gagal">❌ Gagal</span>`;
            else kondisiBadge = det.kondisi || "-";

            detContent.innerHTML = `
                <div class="small">
                    <p class="mb-1"><strong>Kondisi Lapangan:</strong> ${kondisiBadge}</p>
                    ${det.jadwal ? `<p class="mb-1"><strong>Tanggal Pemasangan:</strong> ${det.jadwal}</p>` : ''}
                    ${det.kategori ? `<p class="mb-1"><strong>Kategori:</strong> ${det.kategori}</p>` : ''}
                    ${det.tgl_kembali ? `<p class="mb-1"><strong>Penjadwalan Ulang:</strong> ${det.tgl_kembali}</p>` : ''}
                    ${det.catatan ? `<p class="mb-0"><strong>Catatan:</strong> ${det.catatan}</p>` : ''}
                </div>
            `;
        }
    }

    loadTrackingData();
</script>
</body>
</html>
