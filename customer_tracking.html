<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetra Live Tracking - Status Pemasangan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            background-color: #f4f6f9;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            margin: 0;
        }

        .tracking-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
            border: none;
        }

        /* HEADER BLUE BANNER */
        .tracking-header {
            background-color: #0056b3;
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
        }
        .tracking-header h5 {
            font-weight: 700;
            font-size: 1.25rem;
            margin: 0 0 6px 0;
            letter-spacing: -0.01em;
        }
        .tracking-header p {
            font-size: 0.875rem;
            opacity: 0.9;
            margin: 0;
            font-weight: 500;
        }

        /* BODY CONTENT */
        .tracking-body {
            padding: 24px 28px;
        }

        .section-title {
            text-align: center;
            font-weight: 700;
            font-size: 1.05rem;
            color: #0f172a;
            margin-bottom: 24px;
        }

        /* TIMELINE */
        .timeline {
            position: relative;
            padding-left: 42px;
            margin-bottom: 24px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 15px;
            bottom: 25px;
            width: 2px;
            background: #e2e8f0;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 24px;
        }
        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-icon {
            position: absolute;
            left: -42px;
            top: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #cbd5e1;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .timeline-item.completed .timeline-icon {
            background: #10b981;
        }

        .timeline-content {
            padding-top: 3px;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .step-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e293b;
        }

        .step-badge {
            font-size: 0.725rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: #f1f5f9;
            color: #64748b;
            font-weight: 500;
        }

        .step-badge-blue {
            background: #eff6ff;
            color: #2563eb;
            font-weight: 600;
        }

        /* SUB-DETAILS BOX (STEP 3) */
        .sub-details-box {
            margin-top: 12px;
            margin-bottom: 12px;
            padding-left: 14px;
            border-left: 3px solid #3b82f6;
        }

        .sub-detail-item {
            margin-bottom: 12px;
        }
        .sub-detail-item:last-child {
            margin-bottom: 0;
        }

        .sub-detail-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sub-detail-text {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 2px;
            padding-left: 18px;
            line-height: 1.4;
        }

        .icon-check-purple {
            color: #6366f1;
            font-weight: bold;
        }

        .icon-check-green {
            color: #10b981;
            font-weight: bold;
        }

        /* FOOTER CS BUTTON */
        .cs-footer {
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
            text-align: center;
        }

        .cs-text {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 12px;
        }

        .btn-cs-wa {
            background-color: #22c55e;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .btn-cs-wa:hover {
            background-color: #16a34a;
            color: #ffffff;
        }

        .hide { display: none !important; }
    </style>
</head>
<body>

<div class="tracking-card">
    <!-- HEADER BLUE BANNER -->
    <div class="tracking-header">
        <h5>Aetra Live Tracking</h5>
        <p id="headerSub">No. Form: - | -</p>
    </div>

    <!-- BODY CONTENT -->
    <div class="tracking-body">
        <div id="loading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="small text-muted mt-2 mb-0">Memuat data status pemasangan...</p>
        </div>

        <div id="content" class="hide">
            <div class="section-title">Riwayat & Status Pemasangan</div>

            <div class="timeline" id="timelineList"></div>

            <div class="cs-footer">
                <div class="cs-text">Butuh bantuan atau informasi lebih lanjut?</div>
                <a href="#" id="btnWaCs" target="_blank" class="btn-cs-wa">
                    💬 Hubungi CS Aetra
                </a>
            </div>
        </div>

        <div id="errorBox" class="alert alert-danger hide text-center my-3">
            Data pendaftaran tidak ditemukan. Silakan periksa kembali tautan Anda.
        </div>
    </div>
</div>

<script>
    // ===================================================================
    const SUPABASE_URL = 'https://vyngziqwsdhetapjzlgr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5bmd6aXF3c2RoZXRhcGp6bGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODE0ODIsImV4cCI6MjEwMjQ1NzQ4Mn0._uJcP6YPkXH6mQmIHW-vrKOZIguHGKI_72zEWYei24s';
    // ===================================================================

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const formId = urlParams.get('id');

    function formatTanggal(tglStr) {
        if(!tglStr) return "-";
        const bln = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Ags","Sep","Okt","Nov","Des"];
        let d = new Date(tglStr);
        if (isNaN(d.getTime())) return tglStr;
        return `${d.getDate()} ${bln[d.getMonth()]} ${d.getFullYear()}`;
    }

    async function loadTrackingData() {
        if (!formId) {
            document.getElementById('loading').classList.add('hide');
            document.getElementById('errorBox').classList.remove('hide');
            return;
        }

        const { data, error } = await _supabase.from('pelanggan').select('*').eq('id', formId).single();
        document.getElementById('loading').classList.add('hide');

        if (error || !data) {
            document.getElementById('errorBox').classList.remove('hide');
            return;
        }

        document.getElementById('content').classList.remove('hide');
        document.getElementById('headerSub').innerText = `No. Form: ${data.id} | ${data.nama}`;

        // WA CS Link
        let pesanCS = `Halo CS Aetra, saya ingin bertanya mengenai status pemasangan No. Form ${data.id} atas nama ${data.nama}.`;
        document.getElementById('btnWaCs').href = `https://wa.me/6287788224645?text=${encodeURIComponent(pesanCS)}`;

        const riwayat = data.riwayat_tgl || {};
        const statusMap = { "Pendaftaran Diterima": 1, "Pembayaran Diterima": 2, "Proses Pemasangan": 3, "Selesai": 4 };
        let currentStepNum = statusMap[data.status] || 1;

        let tglStep1 = riwayat["1"] ? riwayat["1"].split(',')[0] : "";
        let tglStep2 = riwayat["2"] ? riwayat["2"].split(',')[0] : "";
        let tglStep3 = riwayat["3"] ? riwayat["3"].split(',')[0] : "";
        let tglStep4 = riwayat["4"] ? riwayat["4"].split(',')[0] : "";

        let det = riwayat.detail_pemasangan || {};

        // TIMELINE RENDERING
        let timelineHtml = `
            <!-- STEP 1 -->
            <div class="timeline-item ${currentStepNum >= 1 ? 'completed' : ''}">
                <div class="timeline-icon">✓</div>
                <div class="timeline-content">
                    <div class="step-header">
                        <span class="step-title">Pendaftaran Diterima</span>
                        ${tglStep1 ? `<span class="step-badge">Selesai: ${tglStep1}</span>` : ''}
                    </div>
                </div>
            </div>

            <!-- STEP 2 -->
            <div class="timeline-item ${currentStepNum >= 2 ? 'completed' : ''}">
                <div class="timeline-icon">✓</div>
                <div class="timeline-content">
                    <div class="step-header">
                        <span class="step-title">Pembayaran Diterima</span>
                        ${tglStep2 ? `<span class="step-badge">Selesai: ${tglStep2}</span>` : ''}
                    </div>
                </div>
            </div>

            <!-- STEP 3 -->
            <div class="timeline-item ${currentStepNum >= 3 ? 'completed' : ''}">
                <div class="timeline-icon">✓</div>
                <div class="timeline-content">
                    <div class="step-header">
                        <span class="step-title">Proses Pemasangan</span>
                        ${tglStep3 ? `<span class="step-badge">Selesai: ${tglStep3}</span>` : ''}
                    </div>

                    ${(currentStepNum >= 3 || det.jadwal || det.kondisi) ? `
                        <div class="sub-details-box">
                            <div class="sub-detail-item">
                                <div class="sub-detail-title"><span class="icon-check-purple">✔</span> Permohonan pemasangan diproses</div>
                                <div class="sub-detail-text">Tim kami sedang menyiapkan penugasan pemasangan untuk lokasi Anda.</div>
                            </div>

                            <div class="sub-detail-item">
                                <div class="sub-detail-title"><span class="icon-check-purple">✔</span> Jadwal terkonfirmasi</div>
                                <div class="sub-detail-text">Tanggal Pemasangan: <strong>${det.jadwal ? formatTanggal(det.jadwal) : 'Dalam Penjadwalan'}</strong></div>
                            </div>

                            <div class="sub-detail-item">
                                <div class="sub-detail-title"><span class="icon-check-green">✔</span> Pemasangan di lokasi</div>
                                <div class="sub-detail-text">
                                    ${renderKondisiSubtext(det)}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            </div>

            <!-- STEP 4 -->
            <div class="timeline-item ${currentStepNum >= 4 ? 'completed' : ''}">
                <div class="timeline-icon">✓</div>
                <div class="timeline-content">
                    <div class="step-header">
                        <span class="step-title">Selesai / Air Mengalir</span>
                        ${tglStep4 ? `<span class="step-badge step-badge-blue">Diperbarui: ${tglStep4}</span>` : ''}
                    </div>
                </div>
            </div>
        `;

        document.getElementById('timelineList').innerHTML = timelineHtml;
    }

    function renderKondisiSubtext(det) {
        if (det.kondisi === "Sukses") {
            return `<strong style="color: #10b981;">[Sukses]</strong> Pemasangan telah selesai dilakukan. ${det.catatan ? det.catatan : ''}`;
        } else if (det.kondisi === "Tertunda") {
            return `<strong style="color: #d97706;">[Tertunda]</strong> ${det.kategori || 'Proses pemasangan tertunda.'} ${det.tgl_kembali ? '<br>Jadwal Ulang: ' + formatTanggal(det.tgl_kembali) : ''} ${det.catatan ? '<br>Catatan: ' + det.catatan : ''}`;
        } else if (det.kondisi === "Gagal") {
            return `<strong style="color: #ef4444;">[Gagal]</strong> ${det.kategori || 'Pemasangan tidak dapat dilanjutkan.'} ${det.catatan ? '<br>Catatan: ' + det.catatan : ''}`;
        } else {
            return `Menunggu proses pemasangan di lokasi.`;
        }
    }

    loadTrackingData();
</script>
</body>
</html>
